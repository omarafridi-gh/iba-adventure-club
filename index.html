<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBA Adventure Club | Official Expedition Society</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            scrap: {
              charcoal: '#353630',
              teal: '#198F9F',
              moss: '#99C34D',
              gold: '#EDA531',
              rust: '#A44200',
              paper: '#FAF6EE',
              kraft: '#EDE2CC',
              card: '#F6EEDB',
              parchment: '#EFE2C5',
              coffee: '#E6D3B1',
              ink: '#2B2C27'
            }
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans: ['"Inter"', 'sans-serif'],
            hand: ['"Caveat"', 'cursive']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FAF5EB;
      background-image: 
        radial-gradient(#D6C6A5 0.9px, transparent 0.9px),
        url("data:image/svg+xml,%3Csvg width='260' height='260' viewBox='0 0 260 260' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 80 Q60 40 120 70 T240 60 M20 130 Q70 100 140 120 T250 110 M0 190 Q80 160 150 180 T260 160 M30 240 Q100 210 180 230 T260 220' stroke='%23C7B594' stroke-width='0.75' stroke-dasharray='3 5' fill='none' opacity='0.35'/%3E%3C/svg%3E");
      background-size: 24px 24px, 260px 260px;
    }

    .crumpled-paper-card {
      background-color: #F8F2E2;
      background-image: 
        radial-gradient(circle at 18% 28%, rgba(225, 195, 140, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 78% 72%, rgba(210, 180, 125, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 45% 85%, rgba(220, 190, 135, 0.2) 0%, transparent 40%),
        radial-gradient(circle at 82% 20%, rgba(255, 255, 255, 0.35) 0%, transparent 35%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 350 350' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='organicWrinkle'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.038' numOctaves='6' result='noise'/%3E%3CfeDiffuseLighting in='noise' lighting-color='%23FFFDF7' surfaceScale='2.4' result='light'%3E%3CfeDistantLight azimuth='75' elevation='52'/%3E%3C/feDiffuseLighting%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23organicWrinkle)' opacity='0.42'/%3E%3C/svg%3E");
      border: 1px solid #DFCEAA;
      box-shadow: 
        0 2px 4px rgba(53, 54, 48, 0.06),
        0 8px 24px rgba(53, 54, 48, 0.11),
        inset 0 0 35px rgba(200, 168, 120, 0.22);
      position: relative;
    }

    .washi-tape {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 110px;
      height: 24px;
      background: rgba(237, 165, 49, 0.65);
      backdrop-filter: blur(2px);
      border-left: 2px dashed rgba(53, 54, 48, 0.35);
      border-right: 2px dashed rgba(53, 54, 48, 0.35);
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
      z-index: 20;
    }
    .washi-tape-teal { background: rgba(25, 143, 159, 0.65); transform: translateX(-50%) rotate(2deg); }
    .washi-tape-rust { background: rgba(164, 66, 0, 0.55); transform: translateX(-50%) rotate(-1.5deg); }
    .washi-tape-moss { background: rgba(153, 195, 77, 0.65); transform: translateX(-50%) rotate(1.8deg); }

    .polaroid {
      background-color: #FAF4E6;
      background-image: 
        linear-gradient(to bottom, #FFFFFF 0%, #F5ECDB 100%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
      padding: 14px 14px 30px 14px;
      box-shadow: 3px 10px 24px rgba(53, 54, 48, 0.14);
      border: 1.5px solid #E2D5BA;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .polaroid:hover {
      transform: translateY(-5px) rotate(1deg);
      box-shadow: 5px 16px 28px rgba(53, 54, 48, 0.2);
    }

    .rubber-stamp {
      border: 2.5px dashed #A44200;
      color: #A44200;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.15em;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-4deg);
      user-select: none;
    }

    @keyframes sunbeamBreathe {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.45; }
    }
    .ambient-sunbeam {
      background: radial-gradient(ellipse at 80% 20%, rgba(255, 235, 160, 0.4) 0%, rgba(255, 220, 130, 0.1) 50%, transparent 80%);
      animation: sunbeamBreathe 5s ease-in-out infinite;
      pointer-events: none;
    }

    /* 3D FULLSCREEN MODAL & FLIP VIEWER */
    .book-3d-stage {
      perspective: 3200px;
      perspective-origin: 50% 50%;
      transform-style: preserve-3d;
      position: relative;
    }

    .open-book-spread {
      background-color: #FAF4E5;
      border: 2px solid #DFCEAA;
      box-shadow: 
        0 35px 95px rgba(0,0,0,0.85),
        inset 0 0 70px rgba(180, 145, 90, 0.25);
      transform-style: preserve-3d;
      position: relative;
    }

    .book-spine-crease {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      background: linear-gradient(to right, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0.28) 50%, rgba(0,0,0,0.06) 100%);
      pointer-events: none;
      z-index: 30;
    }

    .anim-pov-zoom {
      animation: povCameraPush 0.45s cubic-bezier(0.2, 0.85, 0.25, 1) forwards;
      transform-origin: center center;
    }
    @keyframes povCameraPush {
      0% { opacity: 0.85; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    #turningPageLeaf {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      background: #FAF4E5;
      border: 2px solid #DFCEAA;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
      z-index: 45;
      display: none;
      pointer-events: none;
      transform-style: preserve-3d;
      overflow: hidden;
    }

    .turn-page-slow-forward {
      display: block !important;
      right: 0;
      transform-origin: left center;
      animation: turnForward3D 0.88s cubic-bezier(0.22, 0.85, 0.3, 1) forwards;
    }
    @keyframes turnForward3D {
      0% { transform: rotateY(0deg); box-shadow: -8px 0 28px rgba(0,0,0,0.35); filter: brightness(1); }
      48% { filter: brightness(0.92); box-shadow: -30px 10px 45px rgba(0,0,0,0.25); }
      100% { transform: rotateY(-180deg); box-shadow: 10px 0 25px rgba(0,0,0,0.1); filter: brightness(1); }
    }

      display: block !important;
      left: 0;
      transform-origin: right center;
