<!-- PAGE 3: FIELD JOURNAL (SEAMLESS MP4 LOOP WITH INVISIBLE HOTSPOTS) -->
<main id="page-journal" class="page-view w-full h-[calc(100vh-64px)] relative overflow-hidden flex flex-col justify-between select-none">
  
  <!-- 1. FULL-BLEED SEAMLESS MP4 LOOP BACKGROUND -->
  <div class="absolute inset-0 z-0 bg-[#2B160B]">
    <video 
      id="packingRoomVideo"
      autoplay 
      loop 
      muted 
      playsinline 
      preload="auto"
      class="w-full h-full object-cover object-center pointer-events-none"
    >
      <source src="packing_room.mp4" type="video/mp4">
    </video>

    <!-- Soft Ambient Light Overlay -->
    <div class="ambient-sunbeam absolute inset-0 pointer-events-none"></div>
  </div>

  <!-- 2. INVISIBLE HOVER HOTSPOT: CORK NOTICE BOARD (LEFT WALL) -->
  <div class="absolute top-[6%] left-[2%] w-[28%] h-[38%] z-10 cursor-default group pointer-events-auto" title="Field Journal Archive">
    <!-- Subtle interactive shimmer when hovered -->
    <div class="w-full h-full rounded-2xl transition duration-300 group-hover:bg-amber-400/10 group-hover:ring-2 group-hover:ring-amber-300/40"></div>
  </div>

  <!-- 3. INVISIBLE CLICK HOTSPOT: LEATHER JOURNAL (ON FLOOR / RUG) -->
  <!-- Adjust bottom / left / width / height slightly if your video places the book in a different spot -->
  <div class="absolute bottom-[6%] left-[36%] w-[26%] sm:w-[20%] h-[18%] sm:h-[16%] z-20 flex flex-col items-center justify-center cursor-pointer group" onclick="openMasterBookModal()" title="Click to open Field Journal">
    
    <!-- Interactive Pulse Aura: Highlights the baked book on hover -->
    <div class="w-full h-full rounded-2xl transition-all duration-300 group-hover:bg-amber-400/20 group-hover:shadow-[0_0_35px_rgba(237,165,49,0.7)] group-hover:ring-2 group-hover:ring-scrap-gold flex items-center justify-center">
      
      <!-- Floating "Tap to Read" badge that reveals smoothly on hover -->
      <div class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 transform group-hover:-translate-y-1 px-4 py-1.5 rounded-full bg-scrap-gold text-scrap-charcoal font-display font-bold text-xs uppercase tracking-wider shadow-xl border border-white whitespace-nowrap flex items-center gap-1.5">
        <span>Open Journal</span>
        <span>📖</span>
      </div>

    </div>
  </div>

</main>
